<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720pt" height="385pt" viewBox="0 0 1440 770">
  <title>Proposed shared AWS batch pipeline with isolated offline evaluation and a validated shared release</title>
  <desc>Glue prepares label-free facts and restricted references. Q1 uses labels for historical reporting; Q2 detects label-free cases. The evaluator reads all eligible facts, cases and references. Preparation, Q1 and Q2 quality reports and completed evaluation gate direct Step Functions publication of an S3 run manifest. The dashboard pins all reads to that run.</desc>
  <defs>
    <marker id="data" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#52677f"/></marker>
    <marker id="ref" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#a56a15"/></marker>
    <marker id="meta" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto"><path d="M0 0 L9 4 L0 8Z" fill="#8c4fff"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17324d; }
      .box { fill: #eef4f7; stroke: #17324d; stroke-width: 2; rx: 9; }
      .analysis { fill: #eaf5f2; stroke: #176b72; stroke-width: 2; rx: 9; }
      .reference { fill: #fff8ed; stroke: #a56a15; stroke-width: 2; rx: 9; }
      .control { fill: #f5f0ff; stroke: #8c4fff; stroke-width: 2; rx: 9; }
      .title { font-size: 25px; font-weight: bold; }
      .body { font-size: 22px; }
      .small { font-size: 19px; }
      .flow { fill: none; stroke: #52677f; stroke-width: 2.5; marker-end: url(#data); }
      .refs { fill: none; stroke: #a56a15; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#ref); }
      .metadata { fill: none; stroke: #8c4fff; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#meta); }
    </style>
  </defs>
  <rect width="1440" height="770" fill="white"/>
  <rect class="control" x="20" y="18" width="1400" height="76"/>
  <text class="title" x="44" y="49">STEP FUNCTIONS STANDARD · manual, on-demand batch</text>
  <text class="body" x="44" y="79">Prepare → parallel Q1 / Q2 → evaluate → validate all outputs → publish small S3 run manifest directly</text>

  <g>
    <rect class="box" x="20" y="134" width="180" height="122"/>
    <text class="title" x="38" y="168">Local files</text>
    <text class="body" x="38" y="203">Three IBM files</text>
    <text class="small" x="38" y="233">Upload + row IDs</text>
    <rect class="box" x="240" y="134" width="180" height="122"/>
    <text class="title" x="258" y="168">S3 raw</text>
    <text class="body" x="258" y="203">Originals + IDs</text>
    <text class="body" x="258" y="233">Run manifests</text>
    <rect class="box" x="460" y="134" width="200" height="122"/>
    <text class="title" x="478" y="168" style="font-size:20px">Glue preparation</text>
    <text class="body" x="478" y="203">Clean + enrich</text>
    <text class="body" x="478" y="233">Separate labels</text>
    <rect class="box" x="700" y="134" width="260" height="122"/>
    <text class="title" x="718" y="168">S3 curated</text>
    <text class="body" x="718" y="203">Label-free transactions</text>
    <text class="body" x="718" y="233">Account → entity map</text>
    <rect class="reference" x="1000" y="134" width="420" height="122"/>
    <text class="title" x="1018" y="168">S3 restricted references</text>
    <text class="body" x="1018" y="203">Historical labels + Patterns.txt</text>
    <text class="body" x="1018" y="233">Q2 cannot read labels or annotations</text>
  </g>
  <path class="flow" d="M200 195H240"/>
  <path class="flow" d="M420 195H460"/>
  <path class="flow" d="M660 195H700"/>
  <path class="refs" d="M610 134V116H1210V134"/>

  <g>
    <rect class="box" x="20" y="330" width="180" height="120"/>
    <text class="title" x="38" y="364">S3 quality</text>
    <text class="body" x="38" y="398">Prep / Q1 / Q2</text>
    <text class="body" x="38" y="428">Check reports</text>
    <rect class="reference" x="240" y="330" width="260" height="120"/>
    <text class="title" x="258" y="364">Glue evaluator</text>
    <text class="body" x="258" y="398" style="font-size:21px">Full facts + cases + refs</text>
    <text class="small" x="258" y="428" style="font-size:18px">Baseline + source matching</text>
    <rect class="analysis" x="560" y="330" width="220" height="120"/>
    <text class="title" x="578" y="364">Q1 Glue job</text>
    <text class="body" x="578" y="398">Historical risk</text>
    <text class="body" x="578" y="428">Labels permitted</text>
    <rect class="box" x="820" y="330" width="200" height="120"/>
    <text class="title" x="838" y="364">S3 risk tables</text>
    <text class="small" x="838" y="398" style="font-size:16px">N/L by both currencies</text>
    <text class="body" x="838" y="428" style="font-size:20px">Rate / lift / support</text>
    <rect class="box" x="1060" y="330" width="360" height="120"/>
    <text class="title" x="1078" y="364">Glue Catalog + Athena</text>
    <text class="small" x="1078" y="398">Jobs register schemas + partitions</text>
    <text class="body" x="1078" y="428" style="font-size:20px">Query risk summaries + case index</text>
  </g>
  <path class="flow" d="M820 256V310H670V330"/>
  <path class="flow" d="M700 226H680V268H430V330"/>
  <path class="refs" d="M1000 196H976V300H740V330"/>
  <path class="refs" d="M1000 226H984V282H310V330"/>
  <path class="flow" d="M780 390H820"/>
  <path class="flow" d="M1020 390H1060"/>

  <g>
    <rect class="reference" x="240" y="530" width="260" height="110"/>
    <text class="title" x="258" y="566">S3 evaluation</text>
    <text class="small" x="258" y="600">Offline metrics + recovery</text>
    <text class="small" x="258" y="625">Never detector inputs</text>
    <rect class="analysis" x="560" y="530" width="220" height="110"/>
    <text class="title" x="578" y="566">Q2 Glue jobs</text>
    <text class="body" x="578" y="600" style="font-size:19px">Fan patterns / cycles</text>
    <text class="small" x="578" y="625" style="font-size:15px">Label-free; past events only</text>
    <rect class="box" x="820" y="530" width="200" height="110"/>
    <text class="title" x="838" y="566">S3 cases</text>
    <text class="body" x="838" y="600">Index + graphs</text>
    <text class="small" x="838" y="627" style="font-size:18px">Source-ID evidence</text>
    <rect class="box" x="1060" y="530" width="360" height="110"/>
    <text class="title" x="1078" y="566">EC2 · Streamlit dashboard</text>
    <text class="body" x="1078" y="600">Athena results + direct S3 graphs</text>
    <text class="body" x="1078" y="627">Pin all reads to one published run</text>
  </g>
  <path class="flow" d="M700 176H684V258H520V585H560"/>
  <path class="flow" d="M780 585H820"/>
  <path class="flow" d="M1020 585H1060"/>
  <path class="flow" d="M1020 553H1040V418H1060"/>
  <path class="flow" d="M1240 450V530"/>
  <path class="refs" d="M860 640V656H474V450"/>
  <path class="flow" d="M370 450V530"/>

  <path class="metadata" d="M560 256V290H204V310H110V330"/>
  <path class="metadata" d="M560 430H540V474H110V450"/>
  <path class="metadata" d="M560 620H536V494H140V450"/>
  <path class="metadata" d="M470 94V108H222V312H260V330"/>
  <path class="metadata" d="M110 450V680"/>
  <path class="metadata" d="M370 640V680"/>
  <rect class="control" x="20" y="680" width="1400" height="60"/>
  <text class="title" x="40" y="706">STEP FUNCTIONS · SHARED RELEASE GATE → S3 PUBLISHED-RUN MANIFEST</text>
  <text class="small" x="40" y="730">Passing Prep / Q1 / Q2 checks + complete outputs + valid evaluation; one publisher; failure keeps the last successful release.</text>
  <path class="metadata" d="M1320 680V640"/>
  <text class="small" x="20" y="763">Private S3 + encryption · IAM role isolation · CloudWatch logs · SSM access · EC2 needs AWS API egress/endpoints · No Lambda publisher</text>
</svg>
